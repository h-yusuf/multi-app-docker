    #         - ./log/gaji:/var/log/apache2:Z
    hris_tsp:
        build:
            context: .
            dockerfile: ./dockerfile/hris_tsp.dockerfile
            args:
                - php_version=8.3
                - app_name=hris_tsp
        networks:
            - route
        restart: always
        container_name: hris-laju
        ports:
            - "8004:80"
        volumes:
            - ./app/hr:/var/www/html:Z
            - ./config/php8.3/php.ini:/etc/php/8.3/cli/php.ini:Z
            - ./config/php8.3/php.ini:/etc/php/8.3/apache2/php.ini:Z
            - ./config/apache2/hris_tsp.conf:/etc/apache2/sites-available/000-default.conf:Z
            - ./log/hris_tsp:/var/log/apache2:Z
    route:
        build:
            context: .
            dockerfile: ./dockerfile/route.dockerfile
        networks:
            - route
        restart: always
        container_name: route
        ports:
            - "80:80"
        volumes:
            - ./log/route:/var/log/nginx:Z
            - ./config/route:/etc/nginx/conf.d:Z
        command:
            nginx -g 'daemon off;'
networks:
    route:
